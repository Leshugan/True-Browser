name: Build True Browser

# Put this file into .github/workflows/ ONCE. After that everything goes into the repo root:
# uploading truebrowser.sh (or any file in the root) starts the build by itself.
# Artifacts: the APK and report.txt.
on:
  push:
    paths: ['*', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write   # tidies the repo and keeps the signing key in it

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Build (truebrowser.sh from the repo root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash repo/truebrowser.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: out/TrueBrowser-*.apk
          archive: false

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: report.txt
          archive: false
