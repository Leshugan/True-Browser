name: Build True Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Titanium (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view -R jqssun/android-titanium-browser --json tagName,assets > rel.json
          TAG=$(jq -r .tagName rel.json)
          NAME=$(jq -r '.assets[].name' rel.json | grep -i arm64 | grep -i '\.apk$' | head -1)
          gh release download "$TAG" -R jqssun/android-titanium-browser -p "$NAME" -O app.apk
          echo "VER=${TAG#v}" >> $GITHUB_ENV

      - name: Decode (resources only, code untouched)
        run: |
          set -e
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -Xmx6g -jar apktool.jar d -s -f -o dec app.apk > decode.log 2>&1 || (tail -50 decode.log; exit 1)

      - name: Patch
        run: python3 scripts/patch.py dec

      - name: Rebuild
        run: |
          set -e
          java -Xmx6g -jar apktool.jar b -o unsigned.apk dec > build.log 2>&1 || (tail -80 build.log; exit 1)
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "BT=$BT" >> $GITHUB_ENV
          $BT/zipalign -P 16 -f 4 unsigned.apk aligned.apk

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            PASS="$KS_PASS"
          else
            echo "No KEYSTORE_BASE64 secret: using a temporary key"
            PASS=truebrowser
            keytool -genkeypair -keystore ks.jks -storepass $PASS -keypass $PASS -alias tb -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=True Browser"
          fi
          $BT/apksigner sign --ks ks.jks --ks-pass pass:$PASS --out "TrueBrowser-$VER-arm64.apk" aligned.apk
          rm -f ks.jks

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TrueBrowser-${{ env.VER }}-arm64
          path: TrueBrowser-${{ env.VER }}-arm64.apk
          archive: false
