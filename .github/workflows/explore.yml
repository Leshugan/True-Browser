name: Explore Titanium

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Titanium (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view -R jqssun/android-titanium-browser --json tagName,assets > rel.json
          TAG=$(jq -r .tagName rel.json)
          NAME=$(jq -r '.assets[].name' rel.json | grep -i arm64 | grep -i '\.apk$' | head -1)
          gh release download "$TAG" -R jqssun/android-titanium-browser -p "$NAME" -O app.apk
          echo "$TAG" > info.txt

      - name: Decode (with code)
        run: |
          set -e
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            || curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -Xmx12g -jar apktool.jar d -f -o dec app.apk > decode.log 2>&1 || (tail -50 decode.log; exit 1)

      - name: Report
        run: |
          R=report3.txt
          cat info.txt > $R
          P=dec/res/values/public.xml
          id() { grep -oE "type=\"$1\" name=\"$2\" id=\"0x[0-9a-f]+\"" $P | grep -oE '0x[0-9a-f]+'; }
          smali_of() { grep -rlE --include=*.smali "$1" dec/smali* 2>/dev/null; }
          dump() {  # $1 = smali file
            echo "################ $1 ($(wc -l < "$1") lines)" >> $R
            cat "$1" >> $R
          }

          echo "=== IDS" >> $R
          grep -E 'type="id" name="[a-z_]*(close_all|menu_button|toolbar_action|pane_switcher|search_box|new_tab|tile|most_visited|mv_tiles|ntp|feed_stream|search_provider|logo)[a-z_]*"' $P >> $R
          grep -E 'type="(string|plurals)" name="[a-z_]*(close_all)[a-z_]*"' $P >> $R
          grep -E 'type="layout" name="[a-z_]*(hub|tile|most_visited|mv_|ntp|new_tab_page)[a-z_]*"' $P >> $R

          echo "=== HUB TOOLBAR (full)" >> $R
          for f in $(ls dec/smali*/org/chromium/chrome/browser/hub/HubToolbar*.smali dec/smali*/org/chromium/chrome/browser/hub/HubBottomToolbar*.smali 2>/dev/null); do dump "$f"; done

          echo "=== WHO USES toolbar_action_button / pane_switcher_card / toolbar_action_container" >> $R
          for n in toolbar_action_button pane_switcher_card toolbar_action_container menu_button_container; do
            h=$(id id $n); echo "--- $n $h" >> $R
            for f in $(smali_of "$h" | head -8); do
              echo ">> $f" >> $R
              grep -n -B3 -A25 "$h" "$f" | head -120 >> $R
            done
          done

          echo "=== CLOSE ALL TABS" >> $R
          for n in $(grep -oE 'type="id" name="[a-z_]*close_all[a-z_]*"' $P | sed -E 's/.*name="([^"]+)".*/\1/'); do
            h=$(id id $n); echo "--- id $n $h" >> $R
            for f in $(smali_of "$h" | head -8); do
              echo ">> $f" >> $R
              grep -n -B15 -A40 "$h" "$f" | head -200 >> $R
            done
          done

          echo "=== NTP TILES LAYOUTS" >> $R
          for f in $(grep -lE 'MostVisited|TileView|tile_view|mv_tiles|TilesLayout|tiles_layout' dec/res/layout*/*.xml | head -15); do
            echo "##### $f" >> $R; head -c 5000 "$f" >> $R; echo >> $R
          done
          echo "=== NTP TILES CLASSES" >> $R
          ls dec/smali*/org/chromium/chrome/browser/suggestions/tile/ 2>/dev/null >> $R
          for f in $(ls dec/smali*/org/chromium/chrome/browser/suggestions/tile/*Layout*.smali dec/smali*/org/chromium/chrome/browser/suggestions/tile/MostVisitedTilesLayout*.smali 2>/dev/null | sort -u | head -4); do dump "$f"; done
          wc -c $R

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          path: report3.txt
          archive: false
