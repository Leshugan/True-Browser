name: Explore Titanium

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Titanium (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view -R jqssun/android-titanium-browser --json tagName,assets > rel.json
          TAG=$(jq -r .tagName rel.json)
          NAME=$(jq -r '.assets[].name' rel.json | grep -i arm64 | grep -i '\.apk$' | head -1)
          gh release download "$TAG" -R jqssun/android-titanium-browser -p "$NAME" -O app.apk
          echo "$TAG" > info.txt

      - name: Decode (with code)
        run: |
          set -e
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            || curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -Xmx12g -jar apktool.jar d -f -o dec app.apk > decode.log 2>&1 || (tail -50 decode.log; exit 1)

      - name: Report
        shell: bash {0}
        run: |
          R=report4.txt
          cat info.txt > $R
          P=dec/res/values/public.xml
          dump() { echo "################ $1 ($(wc -l < "$1") lines)" >> $R; grep -v '^\s*\.line\|^\s*$' "$1" >> $R; }
          echo "=== LAYOUTS WITH close_all_tabs_button_container" >> $R
          for f in $(grep -l 'close_all_tabs_button' dec/res/layout*/*.xml); do echo "##### $f" >> $R; cat "$f" >> $R; echo >> $R; done
          echo "=== CLOSE-ALL CODE" >> $R
          dump dec/smali/ae0.smali
          dump dec/smali/ld0.smali
          f=dec/smali/fe0.smali; echo "################ $f (part)" >> $R
          grep -n -B60 -A60 '0x7f0102c6' $f | grep -v '\.line' >> $R
          echo "=== NTP" >> $R
          for f in $(grep -lE 'NewTabPageLayout|ntp_scrollview|search_box_stub' dec/res/layout*/*.xml); do echo "##### $f" >> $R; cat "$f" >> $R; echo >> $R; done
          h=$(grep -oE 'type="layout" name="[^"]*" id="0x7f0e[0-9a-f]+"' $P | head -0)
          for c in ntp/NewTabPageLayout suggestions/tile/MostVisitedTilesLayout; do
            for f in $(ls dec/smali*/org/chromium/chrome/browser/$c.smali 2>/dev/null); do dump "$f"; done
          done
          wc -c $R

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          path: report4.txt
          archive: false
