name: Build True Browser

on:
  workflow_dispatch:
    inputs:
      test_variants:
        description: 'Also build test variant (layout only, original package)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Titanium (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view -R jqssun/android-titanium-browser --json tagName,assets > rel.json
          TAG=$(jq -r .tagName rel.json)
          NAME=$(jq -r '.assets[].name' rel.json | grep -i arm64 | grep -i '\.apk$' | head -1)
          gh release download "$TAG" -R jqssun/android-titanium-browser -p "$NAME" -O app.apk
          echo "VER=${TAG#v}" >> $GITHUB_ENV
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "BT=$BT" >> $GITHUB_ENV

      - name: Read resource ids (decode only, nothing is rebuilt)
        run: |
          set -e
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            || curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -Xmx6g -jar apktool.jar d -s -f -o dec app.apk > decode.log 2>&1 || (tail -50 decode.log; exit 1)
          cp dec/res/values/public.xml public.xml
          rm -rf dec

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            echo "KSPASS=$KS_PASS" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret: using a temporary key"
            keytool -genkeypair -keystore ks.jks -storepass truebrowser -keypass truebrowser -alias tb -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=True Browser"
            echo "KSPASS=truebrowser" >> $GITHUB_ENV
          fi

      - name: Build
        run: |
          set -eo pipefail
          PATCH=$(find . -name patch_apk.py -not -path './.git/*' | head -1)
          AX=$(find . -name axml.py -not -path './.git/*' | head -1)
          echo "Scripts: [$PATCH] [$AX]"
          [ -n "$PATCH" ] && [ -n "$AX" ] || { echo "patch_apk.py / axml.py not found in the repo:"; find . -not -path './.git/*' -type f | head -50; exit 1; }
          export PYTHONPATH="$(dirname "$AX")"
          mkdir -p out
          build() {  # $1 = output name, rest = patch options
            n=$1; shift
            python3 "$PATCH" app.apk public.xml p.apk "$@" | tee patch.log
            for f in $(grep -oE '^patched [^ ]+' patch.log | cut -d' ' -f2); do
              echo "----- $f"; $BT/aapt2 dump xmltree --file "$f" p.apk | head -60
            done
            $BT/zipalign -P 16 -f 4 p.apk a.apk
            $BT/apksigner sign --ks ks.jks --ks-pass pass:$KSPASS --out "out/$n.apk" a.apk
            rm -f p.apk a.apk
            echo "$n: $(du -h out/$n.apk | cut -f1)"
          }
          build "TrueBrowser-$VER-arm64"
          if [ "${{ inputs.test_variants }}" = "true" ]; then
            build "TEST-layout-only-$VER" --no-rename
          fi
          rm -f ks.jks

      - name: Upload True Browser
        uses: actions/upload-artifact@v7
        with:
          path: out/TrueBrowser-*.apk
          archive: false

      - name: Upload test (layout only)
        if: ${{ inputs.test_variants }}
        uses: actions/upload-artifact@v7
        with:
          path: out/TEST-*.apk
          archive: false
